<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SYNC — Join</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    background: #0a0a0f;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    min-height: 100vh;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 380px;
    width: 100%;
  }
  h1 {
    font-size: 3.5rem;
    font-weight: 800;
    letter-spacing: 1rem;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7, #ff2d95);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.8rem;
  }
  .subtitle {
    font-size: 0.9rem;
    color: #777;
    letter-spacing: 0.15rem;
    margin-bottom: 2.5rem;
    text-align: center;
    line-height: 1.6;
  }
  .form-group {
    width: 100%;
    margin-bottom: 1.5rem;
  }
  input {
    width: 100%;
    padding: 1rem 1.2rem;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 1.1rem;
    text-align: center;
    letter-spacing: 0.05rem;
    outline: none;
    transition: border-color 0.3s;
  }
  input::placeholder { color: #555; }
  input:focus { border-color: rgba(0,212,255,0.5); }
  .join-btn {
    width: 100%;
    padding: 1.1rem;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.15rem;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: uppercase;
  }
  .join-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(0,150,255,0.3); }
  .join-btn:active { transform: scale(0.98); }
  .join-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .slots {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: #555;
    letter-spacing: 0.1rem;
  }
  .slots span { color: #00d4ff; font-weight: 600; }
  .status {
    margin-top: 1rem;
    font-size: 0.8rem;
    color: #555;
    letter-spacing: 0.1rem;
  }
  .status.connected { color: #00c853; }
  .status.error { color: #ff4444; }
  .message {
    margin-top: 1.5rem;
    padding: 1rem 1.5rem;
    border-radius: 12px;
    background: rgba(255,40,40,0.1);
    border: 1px solid rgba(255,40,40,0.2);
    color: #ff6666;
    font-size: 0.9rem;
    text-align: center;
    display: none;
  }
  .message.full {
    background: rgba(255,165,0,0.1);
    border: 1px solid rgba(255,165,0,0.2);
    color: #ffaa33;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div class="container" id="joinScreen">
    <h1>SYNC</h1>
    <p class="subtitle">Become part of one shared song.</p>
    <div class="form-group">
      <input type="text" id="nameInput" placeholder="Your first name" maxlength="20" autocomplete="off" autofocus>
    </div>
    <button class="join-btn" id="joinBtn" onclick="joinPerformance()">JOIN THE PERFORMANCE</button>
    <p class="slots"><span id="slotsLeft">10</span> positions remaining</p>
    <p class="status" id="connectionStatus">Connecting...</p>
    <div class="message" id="message"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const nameInput = document.getElementById('nameInput');
    const joinBtn = document.getElementById('joinBtn');
    const slotsLeft = document.getElementById('slotsLeft');
    const statusEl = document.getElementById('connectionStatus');
    const messageEl = document.getElementById('message');

    // Check if already joined (stored in session)
    const savedName = sessionStorage.getItem('sync_name');
    const savedRole = sessionStorage.getItem('sync_role');

    socket.on('connect', () => {
      statusEl.textContent = 'Connected';
      statusEl.className = 'status connected';

      // If we had a session, try to rejoin
      if (savedName) {
        socket.emit('volunteerJoin', { name: savedName });
      }
    });

    socket.on('disconnect', () => {
      statusEl.textContent = 'Disconnected';
      statusEl.className = 'status error';
    });

    socket.on('stateSync', (state) => {
      const remaining = 10 - state.volunteers.length;
      slotsLeft.textContent = remaining;
      if (remaining <= 0 && !savedName) {
        joinBtn.disabled = true;
      }
      if (!state.joinOpen && !savedName) {
        joinBtn.disabled = true;
        showMessage('Joining is currently closed.', 'full');
      }
    });

    socket.on('joinAccepted', ({ volunteer, role }) => {
      sessionStorage.setItem('sync_name', volunteer.name);
      sessionStorage.setItem('sync_roleId', volunteer.roleId);
      sessionStorage.setItem('sync_role', role.name);
      sessionStorage.setItem('sync_id', volunteer.id);
      // Redirect to player
      window.location.href = '/player';
    });

    socket.on('joinRejected', ({ reason }) => {
      showMessage(reason, reason.includes('FILLED') ? 'full' : '');
      joinBtn.disabled = false;
    });

    function joinPerformance() {
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.focus();
        return;
      }
      joinBtn.disabled = true;
      socket.emit('volunteerJoin', { name });
    }

    function showMessage(text, cls) {
      messageEl.textContent = text;
      messageEl.className = 'message' + (cls ? ' ' + cls : '');
      messageEl.style.display = 'block';
      setTimeout(() => { messageEl.style.display = 'none'; }, 5000);
    }

    // Enter key to join
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinPerformance();
    });
  </script>
</body>
</html>
