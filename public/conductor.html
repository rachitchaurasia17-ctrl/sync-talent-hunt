<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #04060f; }
  a { color: #5ee7ff; text-decoration: none; } a:hover { color: #eaf2ff; }
  ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-thumb { background: rgba(120,160,255,0.25); border-radius: 3px; }
  select { outline: none; }
  
  .app-wrap { padding: 16px 24px; }
  .start-btn { padding: 24px 60px; font-size: 24px; border-radius: 20px; }
  .header-tag { font-size: 9px; padding: 4px 10px; }
  .header-link { font-size: 10px; padding: 6px 12px; }
  
  @media (max-width: 600px) {
    .app-wrap { padding: 12px 12px; gap: 12px; }
    .start-btn { padding: 16px 24px !important; font-size: 18px !important; border-radius: 12px !important; }
    .header-tag, .header-link { font-size: 8px !important; padding: 4px 6px !important; }
    .title-text { font-size: 12px !important; }
  }
</style>
</helmet>
<div class="app-wrap" data-screen-label="Conductor Console" style="min-height: 100vh; background: radial-gradient(100% 80% at 50% 0%, #070b1a 0%, #04060f 60%); font-family: 'Space Grotesk', sans-serif; color: #eaf2ff; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px;">
  
  <!-- 1. COMPACT TOP HEADER -->
  <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
    <div class="title-text" style="font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 0.28em; color: #eaf2ff;">SYNC<span style="color: #5ee7ff;"> · CONDUCTOR</span></div>
    <div class="header-tag" style="letter-spacing: 0.26em; color: rgba(234,242,255,0.3); border: 1px solid rgba(234,242,255,0.1); border-radius: 999px;">PRIVATE — NEVER PROJECTED</div>
    <div style="flex: 1;"></div>
    <div class="header-tag" style="letter-spacing: 0.2em; color: {{ liveColor }};">{{ liveText }}</div>
    <a class="header-link" href="/projector" target="_blank" style="letter-spacing: 0.16em; border: 1px solid rgba(94,231,255,0.4); border-radius: 6px;">OPEN PROJECTOR ↗</a>
  </div>

  <!-- 2. BIG START/STOP BUTTON -->
  <div style="margin-top: 40px; text-align: center;">
    <sc-if value="{{ !started }}">
      <button class="start-btn" onClick="{{ togglePlay }}" style="all: unset; cursor: pointer; font-family: 'Unbounded', sans-serif; font-weight: 600; letter-spacing: 0.2em; background: rgba(94,231,255,0.1); border: 2px solid #5ee7ff; color: #5ee7ff; box-shadow: 0 0 20px rgba(94,231,255,0.3); box-sizing: border-box; max-width: 100%;">START SHOW</button>
    </sc-if>
    <sc-if value="{{ started }}">
      <button class="start-btn" onClick="{{ togglePlay }}" style="all: unset; cursor: pointer; font-family: 'Unbounded', sans-serif; font-weight: 600; letter-spacing: 0.2em; background: rgba(255,94,138,0.1); border: 2px solid #ff9cb6; color: #ff9cb6; box-shadow: 0 0 20px rgba(255,94,138,0.3); box-sizing: border-box; max-width: 100%;">STOP SHOW</button>
    </sc-if>
  </div>

  <div style="display: grid; grid-template-columns: minmax(min(100%, 350px), 1fr); max-width: 800px; margin: 0 auto; width: 100%; gap: 20px; align-items: start; margin-top: 40px;">
    
    <!-- RIGHT COLUMN: VOLUNTEERS (now just central) -->
    <div style="background: rgba(10,15,30,0.7); border: 1px solid rgba(120,160,255,0.12); border-radius: 14px; padding: 18px; display: flex; flex-direction: column;">
      
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="font-size: 11px; letter-spacing: 0.2em; color: rgba(234,242,255,0.5);">VOLUNTEERS</div>
      </div>
      
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(120,160,255,0.1);">
        <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.1em; color: #eaf2ff;">{{ joinedText }} JOINED</div>
        <button onClick="{{ toggleShowAllSlots }}" style="all: unset; cursor: pointer; font-size: 9px; letter-spacing: 0.1em; color: rgba(94,231,255,0.7); background: rgba(94,231,255,0.1); padding: 4px 10px; border-radius: 6px;">{{ showAllSlotsLabel }}</button>
      </div>

      <!-- Add Volunteer / QR drawer (DEFAULT OPEN NOW) -->
      <div style="margin-top: 12px; background: rgba(234,242,255,0.02); border-radius: 8px; border: 1px solid rgba(234,242,255,0.05);">
        <div style="padding: 20px 10px; display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <div style="font-size: 10px; letter-spacing: 0.15em; color: #eaf2ff; text-align: center; font-weight: bold;">SCAN TO JOIN BAND</div>
          <sc-if value="{{ qrDataUrl }}">
            <img src="{{ qrDataUrl }}" style="width: 180px; height: 180px; border-radius: 8px; border: 1px solid rgba(234,242,255,0.1);" />
          </sc-if>
          <div style="font-size: 10px; letter-spacing: 0.1em; color: rgba(234,242,255,0.5);">{{ joinUrlText }}</div>
        </div>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px;">
        <sc-for list="{{ visibleVolRows }}" as="v">
          <!-- Volunteer row (copied from existing) -->
          <div style="background: rgba(234,242,255,0.03); border: 1px solid rgba(234,242,255,0.05); border-radius: 10px; overflow: hidden; opacity: {{ v.rowOpacity }};">
            <div onClick="{{ v.toggleExpand }}" style="display: grid; grid-template-columns: 10px 1fr 60px 40px; align-items: center; gap: 10px; padding: 12px; cursor: pointer;">
              <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ v.color }}; box-shadow: 0 0 8px {{ v.color }};"></span>
              <div style="min-width: 0;">
                <div style="font-size: 12px; font-weight: 500; letter-spacing: 0.08em; color: rgba(234,242,255,0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ v.name }}</div>
                <div style="font-size: 9px; letter-spacing: 0.1em; color: rgba(234,242,255,0.4); margin-top: 2px;">{{ v.role }}</div>
              </div>
              <div style="font-size: 9px; letter-spacing: 0.1em; color: {{ v.statusColor }}; text-align: right;">{{ v.statusText }}</div>
              <div style="font-size: 12px; text-align: right; color: rgba(234,242,255,0.3);">{{ v.expandIcon }}</div>
            </div>
            <div style="height: 2px; background: rgba(234,242,255,0.04);">
              <div style="height: 100%; width: {{ v.energyPct }}; background: linear-gradient(90deg, {{ v.color }}, #eaf2ff); box-shadow: 0 0 8px {{ v.color }}; transition: width 0.25s ease;"></div>
            </div>
            <sc-if value="{{ v.expanded }}">
              <div style="padding: 12px; border-top: 1px solid rgba(234,242,255,0.05); background: rgba(0,0,0,0.15); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                <select value="{{ v.role }}" onChange="{{ v.onRole }}" style="background: rgba(234,242,255,0.05); border: 1px solid rgba(234,242,255,0.1); border-radius: 6px; padding: 6px 8px; color: rgba(234,242,255,0.7); font-family: 'Space Grotesk', sans-serif; font-size: 9px; letter-spacing: 0.1em; cursor: pointer; flex: 1; min-width: 120px;">
                  <sc-for list="{{ roleNames }}" as="rn"><option value="{{ rn }}" style="background: #0a0f1e;">{{ rn }}</option></sc-for>
                </select>
                <button onClick="{{ v.doTap }}" style="all: unset; cursor: pointer; font-size: 9px; letter-spacing: 0.1em; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(94,231,255,0.35); color: #5ee7ff; background: rgba(94,231,255,0.05);">TAP</button>
                <button onClick="{{ v.toggleMute }}" style="all: unset; cursor: pointer; font-size: 9px; letter-spacing: 0.1em; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(234,242,255,0.15); color: {{ v.muteColor }}; background: rgba(234,242,255,0.02);">{{ v.muteTxt }}</button>
                <button onClick="{{ v.toggleEnable }}" style="all: unset; cursor: pointer; font-size: 9px; letter-spacing: 0.1em; padding: 6px 12px; border-radius: 6px; border: 1px solid rgba(234,242,255,0.15); color: {{ v.enColor }}; background: rgba(234,242,255,0.02);">{{ v.enTxt }}</button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { 
    st: null, 
    energies: {}, 
    qrDataUrl: '', 
    joinUrlText: '',
    showAllSlots: false,
    expandedVolId: null
  };
  refs = {};
  R(n) { return this.refs[n] || (this.refs[n] = React.createRef()); }
  
  componentDidMount() {
    fetch('/api/qr').then(r => r.json()).then(d => {
        if (d.qr) this.setState({ qrDataUrl: d.qr, joinUrlText: d.url });
    });
    import('./sync-state.js').then(S => {
      this.ROLE_LIST = S.ROLE_LIST;
      this.store = new S.SyncStore('conductor');
      this.setState({ st: this.store.get() });
      this.unsub = this.store.subscribe(st => this.setState({ st: { ...st } }));
      this.unmsg = this.store.onMessage(m => {
        if (m.type === 'energy') {
          const e = {};
          m.list.forEach(x => e[x.id] = x);
          this._lastBeat = Date.now();
          this.setState({ energies: e });
        }
      });
    });
  }
  
  componentWillUnmount() {
    if (this.unsub) this.unsub(); if (this.unmsg) this.unmsg();
  }
  

  swapRole(id, newRole) {
    const st = this.store.get();
    const me = st.vols[id];
    const other = st.vols.find(v => v.role === newRole);
    if (!other || other.id === id) return;
    const meta = this.ROLE_LIST;
    const myMeta = meta.find(r => r.role === me.role), newMeta = meta.find(r => r.role === newRole);
    this.store.patchVol(id, { role: newRole, color: newMeta.color });
    this.store.patchVol(other.id, { role: myMeta.role, color: myMeta.color });
  }
  
  renderVals() {
    const st = this.state.st;
    if (!st) return { started: false, visibleVolRows: [], roleNames: [], liveText: 'CONNECTING…', liveColor: 'rgba(234,242,255,0.4)', joinedText: '0', voiceStatusText: '', voiceStatusColor: '' };
    
    const projLive = this._lastBeat && Date.now() - this._lastBeat < 4000;
    const E = this.state.energies;
    
    const allVols = st.vols.map(v => {
      const expanded = this.state.expandedVolId === v.id;
      return {
        ...v,
        color: v.color, role: v.role,
        name: v.connected ? v.name || v.role : 'OPEN SLOT',
        rowOpacity: v.enabled ? 1 : 0.45,
        energyPct: Math.round((E[v.id] ? E[v.id].energy : 0) * 100) + '%',
        muteTxt: v.muted ? 'UNMUTE' : 'MUTE',
        muteColor: v.muted ? '#ff9cb6' : 'rgba(234,242,255,0.5)',
        enTxt: v.enabled ? 'ON' : 'OFF',
        enColor: v.enabled ? '#5ee7ff' : 'rgba(234,242,255,0.3)',
        statusText: v.connected ? 'CONN' : 'WAIT',
        statusColor: v.connected ? '#5ee7ff' : 'rgba(234,242,255,0.3)',
        expanded: expanded,
        expandIcon: expanded ? '▴' : '▾',
        toggleExpand: () => this.setState({ expandedVolId: expanded ? null : v.id }),
        doTap: () => { if(v.connected) this.store.tap(v.id); },
        toggleMute: () => this.store.patchVol(v.id, { muted: !v.muted }),
        toggleEnable: () => this.store.patchVol(v.id, { enabled: !v.enabled }),
        onRole: (e) => this.swapRole(v.id, e.target.value),
      };
    });

    const joinedCount = st.vols.filter(v => v.connected).length;
    let visibleVolRows = allVols;
    if (!this.state.showAllSlots && joinedCount > 0) {
      visibleVolRows = allVols.filter(v => v.connected);
    }
    
    return {
      started: st.started,
      togglePlay: () => this.store.patch({ started: !st.started }),
      visibleVolRows,
      roleNames: this.ROLE_LIST ? this.ROLE_LIST.map(r => r.role) : [],
      
      voiceStatusText: st.voiceStatus === 'live' ? 'IN MIX' : 'WAITING',
      voiceStatusColor: st.voiceStatus === 'live' ? '#5ee7ff' : 'rgba(234,242,255,0.4)',
      
      liveText: projLive ? '● PROJECTOR LIVE' : '○ PROJECTOR NOT DETECTED',
      liveColor: projLive ? '#5ee7ff' : 'rgba(255,209,102,0.8)',
      
      joinedText: joinedCount,
      
      clearVolunteers: () => { 
        if (window.confirm("Disconnect ALL volunteers? They will need to reconnect. This action cannot be undone.")) {
          if (this.store && this.store.socket) this.store.socket.emit('conductorClearVolunteers'); 
        }
      },
      
      qrDataUrl: this.state.qrDataUrl,
      joinUrlText: this.state.joinUrlText,
      
      showAllSlotsLabel: this.state.showAllSlots ? 'HIDE OPEN SLOTS' : 'VIEW OPEN SLOTS',
      toggleShowAllSlots: () => this.setState({ showAllSlots: !this.state.showAllSlots })
    };
  }
}
</script>
</body>
</html>
