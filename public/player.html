<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;600;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #03050c; overflow: hidden; }
  a { color: #5ee7ff; text-decoration: none; } a:hover { color: #eaf2ff; }
  input { outline: none; }
  @keyframes vring { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes vfloat { 0% { transform: translateY(0); opacity: 0.9; } 100% { transform: translateY(-46vh); opacity: 0; } }
  @keyframes vbreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
</style>
</helmet>
<div data-screen-label="Volunteer Phone" style="position: fixed; inset: 0; background: radial-gradient(120% 100% at 50% 30%, #070b1a 0%, #03050c 60%, #020307 100%); font-family: 'Space Grotesk', sans-serif; color: #eaf2ff; user-select: none; -webkit-user-select: none; overflow: hidden;">
  <div ref="{{ fxLayer }}" style="position: absolute; inset: 0; pointer-events: none; overflow: hidden;"></div>

  <sc-if value="{{ joined }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));">
      <div style="text-align: center; margin-top: 4vh;">
        <div style="font-size: 11px; letter-spacing: 0.4em; color: rgba(234,242,255,0.5);">{{ myName }}</div>
        <div style="margin-top: 8px; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 20px; letter-spacing: 0.2em; color: {{ roleColor }}; text-shadow: 0 0 24px {{ roleColor }};">{{ myRole }}</div>
      </div>
      <div style="flex: 1; display: grid; place-items: center; width: 100%;">
        <div style="position: relative; width: min(78vw, 46vh); aspect-ratio: 1;">
          <svg viewBox="0 0 100 100" style="position: absolute; inset: -10%; width: 120%; height: 120%; transform: rotate(-90deg); pointer-events: none;">
            <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(234,242,255,0.08)" stroke-width="1.4"></circle>
            <circle ref="{{ ringEl }}" cx="50" cy="50" r="47" fill="none" stroke="{{ roleColor }}" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="295.3" stroke-dashoffset="295.3" style="filter: drop-shadow(0 0 6px {{ roleColor }}); transition: stroke-dashoffset 0.25s ease;"></circle>
          </svg>
          <button ref="{{ btnEl }}" onClick="{{ onTap }}" style="all: unset; -webkit-tap-highlight-color: transparent; position: absolute; inset: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 38%, {{ btnGlow }} 0%, rgba(10, 16, 34, 0.9) 62%); border: 1.5px solid {{ btnBorder }}; box-shadow: 0 0 60px {{ btnShadow }}, inset 0 0 40px rgba(94,231,255,0.05); transition: transform 0.09s ease, box-shadow 0.3s ease; animation: vbreathe 3.2s ease-in-out infinite;">
            <span style="font-family: 'Unbounded', sans-serif; font-weight: 400; font-size: clamp(15px, 5.4vw, 26px); letter-spacing: 0.3em; margin-left: 0.3em; color: {{ btnTextColor }}; text-shadow: 0 0 20px {{ roleColor }};">{{ btnText }}</span>
          </button>
        </div>
      </div>
      <div style="min-height: 64px; text-align: center;">
        <div style="font-size: 13px; letter-spacing: 0.34em; color: {{ statusColor }}; transition: color 0.4s ease;">{{ statusText }}</div>
        <sc-if value="{{ isVoice }}" hint-placeholder-val="{{ false }}">
          <div style="margin-top: 12px; display: flex; gap: 10px; justify-content: center;">
            <button onClick="{{ recordVoice }}" style="all: unset; -webkit-tap-highlight-color: transparent; cursor: pointer; padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(94,231,255,0.5); color: #5ee7ff; font-size: 12px; letter-spacing: 0.18em; background: rgba(94,231,255,0.07);">{{ recLabel }}</button>
            <button onClick="{{ simVoice }}" style="all: unset; -webkit-tap-highlight-color: transparent; cursor: pointer; padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(234,242,255,0.18); color: rgba(234,242,255,0.6); font-size: 12px; letter-spacing: 0.18em;">SIMULATE</button>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ notJoined }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; box-sizing: border-box;">
      <div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: 44px; letter-spacing: 0.3em; margin-left: 0.3em; color: #eaf2ff; text-shadow: 0 0 50px rgba(94,231,255,0.5);">SYNC</div>
      <div style="margin-top: 10px; font-size: 10px; letter-spacing: 0.44em; color: rgba(94,231,255,0.55);">TEN HUMANS. ONE SONG.</div>
      <div style="margin-top: 9vh; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 14px;">
        <input ref="{{ nameEl }}" placeholder="YOUR NAME" maxlength="14" style="box-sizing: border-box; width: 100%; padding: 18px 20px; border-radius: 16px; border: 1px solid rgba(120,160,255,0.25); background: rgba(234,242,255,0.04); color: #eaf2ff; font-family: 'Space Grotesk', sans-serif; font-size: 16px; letter-spacing: 0.14em; text-align: center;">
        <button onClick="{{ onJoin }}" style="all: unset; -webkit-tap-highlight-color: transparent; cursor: pointer; box-sizing: border-box; width: 100%; padding: 18px 20px; border-radius: 16px; text-align: center; font-family: 'Unbounded', sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 0.32em; color: #04060e; background: linear-gradient(90deg, #5ee7ff, #7fa8ff); box-shadow: 0 0 40px rgba(94,231,255,0.35);">JOIN</button>
        <div style="text-align: center; font-size: 11px; letter-spacing: 0.28em; color: rgba(234,242,255,0.4);">{{ slotsText }}</div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 390, &quot;height&quot;: 780}}">
class Component extends DCLogic {
  state = { vol: null, started: false, countdown: '', energy: 0, charge: 0, lost: false, recState: 'idle', slots: 10, tick: 0 };
  refs = {};
  R(n) { return this.refs[n] || (this.refs[n] = React.createRef()); }
  gate(role) {
    return this.state.started;
  }
  componentDidMount() {
    import('./sync-state.js').then(S => {
      this.store = new S.SyncStore('volunteer');
      const st = this.store.get();
      this._lastReset = st.resetCount;
      const savedId = localStorage.getItem('sync-my-vol');
      if (savedId !== null && st.vols[+savedId] && st.vols[+savedId].connected) this.setState({ vol: st.vols[+savedId] });
      this.syncFromStore(st);
      this.unsub = this.store.subscribe(s2 => this.syncFromStore(s2));
      this.unmsg = this.store.onMessage(m => {
        if (m.type === 'energy') {
          this._lastBeat = Date.now();
          if (this.state.vol) {
            const mine = m.list.find(x => x.id === this.state.vol.id);
            if (mine) this.setState({ energy: mine.energy, charge: mine.charge, started: m.started, countdown: m.countdown, lost: false });
          }
        }
      });
    });
    this._watch = setInterval(() => {
      const stale = this._lastBeat && Date.now() - this._lastBeat > 4000;
      if (!!stale !== this.state.lost) this.setState({ lost: !!stale });
      this.setState(s => ({ tick: s.tick + 1 }));
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this._watch);
    if (this.unsub) this.unsub(); if (this.unmsg) this.unmsg();
  }
  syncFromStore(st) {
    if (st.resetCount !== this._lastReset) {
      this._lastReset = st.resetCount;
      localStorage.removeItem('sync-my-vol');
      this.setState({ vol: null, energy: 0, charge: 0, started: false });
      return;
    }
    const slots = st.vols.filter(v => !v.connected).length;
    const patch = { started: st.started, slots };
    if (this.state.vol) patch.vol = st.vols[this.state.vol.id];
    this.setState(patch);
  }
  onJoin = () => {
    if (!this.store) return;
    const name = (this.R('nameEl').current.value || '').trim();
    if (!name) { this.R('nameEl').current.placeholder = 'PLEASE ENTER A NAME'; return; }
    
    // Send join request via our new async store
    this.store.join(name.toUpperCase());
    
    // Register callbacks if not already registered
    if (!this._joinListenersSet) {
        this._joinListenersSet = true;
        this.store.onJoinAccepted = (vol) => {
            localStorage.setItem('sync-my-vol', String(vol.id));
            this.setState({ vol });
            if (navigator.vibrate) navigator.vibrate(40);
        };
        this.store.onJoinRejected = (reason) => {
            this.R('nameEl').current.value = '';
            this.R('nameEl').current.placeholder = reason || 'JOIN REJECTED';
        };
    }
  };
  status() {
    const v = this.state.vol, started = this.state.started;
    if (!v) return ['', ''];
    if (this.state.lost) return ['CONNECTION LOST', 'rgba(255,94,138,0.9)'];
    if (!v.enabled) return ['DISABLED', 'rgba(234,242,255,0.35)'];
    if (v.muted) return ['MUTED', 'rgba(255,94,138,0.8)'];
    
    const live = this.gate(v.role) && started;
    if (!live) return ['WAITING FOR CONDUCTOR...', 'rgba(234,242,255,0.45)'];
    
    if (this._wasLive !== started) { this._wasLive = started; this._liveAt = Date.now(); }
    if (Date.now() - (this._liveAt || 0) < 4000) return ['YOUR TURN!', v.color];
    if (this.state.energy < 0.32) return ['KEEP THE ENERGY ALIVE', '#ffd166'];
    return ['TAP TO POWER YOUR LAYER', 'rgba(234,242,255,0.6)'];
  }
  onTap = () => {
    const v = this.state.vol;
    if (!v || !v.enabled || v.muted || this.state.lost) return;
    this.store.tap(v.id);
    if (navigator.vibrate) navigator.vibrate(18);
    this.setState(s => ({ energy: Math.min(1, s.energy + 0.13), charge: Math.min(1, s.charge + 0.09) }));
    const btn = this.R('btnEl').current;
    if (btn) {
      btn.style.transform = 'scale(0.94)';
      setTimeout(() => { if (btn) btn.style.transform = 'scale(1)'; }, 90);
    }
    const fx = this.R('fxLayer').current;
    if (fx) {
      const wrap = btn.parentElement.getBoundingClientRect();
      const ring = document.createElement('div');
      ring.style.cssText = `position:absolute;left:${wrap.left}px;top:${wrap.top}px;width:${wrap.width}px;height:${wrap.height}px;border-radius:50%;border:2px solid ${v.color};animation:vring 0.7s ease-out forwards;`;
      fx.appendChild(ring); setTimeout(() => ring.remove(), 750);
      const dot = document.createElement('div');
      const dx = wrap.left + wrap.width / 2 + (Math.random() - 0.5) * 60;
      dot.style.cssText = `position:absolute;left:${dx}px;top:${wrap.top + 10}px;width:6px;height:6px;border-radius:50%;background:${v.color};box-shadow:0 0 12px ${v.color};animation:vfloat 1.4s ease-out forwards;`;
      fx.appendChild(dot); setTimeout(() => dot.remove(), 1450);
    }
  };
  recordVoice = async () => {
    if (this.state.recState === 'rec') return;
    this.setState({ recState: 'rec' });
    if (navigator.vibrate) navigator.vibrate(30);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const rec = new MediaRecorder(stream);
      const chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        try {
          const buf = await new Blob(chunks).arrayBuffer();
          const ab = await ac.decodeAudioData(buf);
          const pcm = new Float32Array(ab.getChannelData(0));
          this.store.send('voicePCM', { pcm, rate: ab.sampleRate });
          this.setState({ recState: 'sent' });
          if (navigator.vibrate) navigator.vibrate([30, 60, 30]);
        } catch (e2) { this.setState({ recState: 'idle' }); }
        ac.close();
      };
      rec.start();
      setTimeout(() => rec.state !== 'inactive' && rec.stop(), 2000);
    } catch (e) {
      this.setState({ recState: 'idle' });
      this.store.send('voiceSim', {});
    }
  };
  simVoice = () => { this.store.send('voiceSim', {}); this.setState({ recState: 'sent' }); };
  renderVals() {
    const v = this.state.vol;
    const [statusText, statusColor] = this.status();
    const live = v && this.gate(v.role) && v.enabled && !v.muted && !this.state.lost && this.state.started;
    const c = v ? v.color : '#5ee7ff';
    const ring = this.R('ringEl').current;
    if (ring) ring.style.strokeDashoffset = String(295.3 * (1 - (live ? this.state.energy : 0)));
    
    return {
      joined: !!v, notJoined: !v,
      myName: v ? v.name : '', myRole: v ? v.role : '', roleColor: c, isVoice: !!v && v.role === 'VOICE FX',
      btnText: !live ? 'WAIT' : 'TAP',
      btnTextColor: live ? '#eaf2ff' : 'rgba(234,242,255,0.3)',
      btnGlow: live ? c + '3d' : 'rgba(94,231,255,0.06)',
      btnBorder: live ? c + 'aa' : 'rgba(120,160,255,0.2)',
      btnShadow: live ? c + '55' : 'rgba(94,231,255,0.08)',
      statusText, statusColor,
      recLabel: this.state.recState === 'rec' ? 'LISTENING…' : this.state.recState === 'sent' ? 'SENT ✓' : 'RECORD 2S',
      onTap: this.onTap, onJoin: this.onJoin, recordVoice: this.recordVoice, simVoice: this.simVoice,
      slotsText: `${this.state.slots} OF 10 SLOTS OPEN`,
      nameEl: this.R('nameEl'), btnEl: this.R('btnEl'), ringEl: this.R('ringEl'), fxLayer: this.R('fxLayer'),
    };
  }
}
</script>
</body>
</html>
