<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300;400;600;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #03050c; overflow: hidden; }
  a { color: #5ee7ff; text-decoration: none; } a:hover { color: #eaf2ff; }
</style>
</helmet>
<div data-screen-label="SYNC Projector" style="position: fixed; inset: 0; background: radial-gradient(120% 90% at 50% 42%, #060a18 0%, #03050c 55%, #020307 100%); font-family: 'Space Grotesk', sans-serif; color: #eaf2ff; user-select: none;">
  <canvas ref="{{ cvs }}" onClick="{{ onCanvasClick }}" style="position: absolute; inset: 0; width: 100%; height: 100%;"></canvas>

  <div ref="{{ logoWrap }}" style="position: absolute; left: 50%; top: 46%; width: min(34vh, 26vw); transform: translate(-50%, -50%); pointer-events: none;">
    <div ref="{{ halo }}" style="position: absolute; left: 50%; top: 50%; width: 230%; aspect-ratio: 1; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(94,231,255,0.2) 0%, rgba(94,124,254,0.1) 34%, rgba(155,109,255,0.05) 55%, transparent 72%); opacity: 0;"></div>
    <div ref="{{ logoScale }}" style="position: relative;">
      <img ref="{{ imgGlow }}" src="assets/logo-glow.png" alt="NMIMS Chandigarh" style="display: block; width: 100%; opacity: 0.04; filter: drop-shadow(0 0 24px rgba(94,231,255,0.55));">
      <img ref="{{ imgCrest }}" src="assets/logo-crest.png" alt="" style="display: block; width: 100%; position: absolute; inset: 0; opacity: 0; filter: drop-shadow(0 0 32px rgba(255,94,138,0.35)) drop-shadow(0 0 60px rgba(94,231,255,0.3));">
    </div>
  </div>

  <div ref="{{ ovSync }}" style="position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 2s ease; pointer-events: none;">
    <div style="text-align: center;">
      <div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(70px, 13vw, 260px); letter-spacing: 0.22em; margin-left: 0.22em; color: #eaf2ff; text-shadow: 0 0 90px rgba(94,231,255,0.5);">SYNC</div>
      <div style="margin-top: 1vh; font-size: clamp(11px, 1vw, 18px); letter-spacing: 0.5em; color: rgba(94,231,255,0.55);">TEN HUMANS. ONE SONG.</div>
    </div>
  </div>

  <div ref="{{ ovQ }}" style="position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 2.2s ease; pointer-events: none;">
    <div style="font-family: 'Unbounded', sans-serif; font-weight: 200; font-size: clamp(20px, 2.6vw, 44px); letter-spacing: 0.14em; color: rgba(234,242,255,0.85); text-align: center; max-width: 80vw;">Can ten strangers become one musician?</div>
  </div>

  <div ref="{{ ovProof }}" style="position: absolute; left: 50%; top: 76%; transform: translate(-50%, 0); opacity: 0; transition: opacity 1s ease; pointer-events: none;">
    <div ref="{{ proofText }}" style="font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: clamp(18px, 2.2vw, 40px); letter-spacing: 0.3em; color: rgba(234,242,255,0.9); text-align: center;"></div>
  </div>

  <div ref="{{ ovVoice }}" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 72vw; text-align: center; opacity: 0; transition: opacity 1.2s ease; pointer-events: none; z-index: 3;">
    <div ref="{{ voiceLabel }}" style="font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: clamp(14px, 1.4vw, 24px); letter-spacing: 0.5em; color: rgba(234,242,255,0.7); margin-bottom: 3vh;">ONE WORD</div>
    <canvas ref="{{ waveCvs }}" width="1400" height="320" style="width: 100%; height: 26vh;"></canvas>
  </div>

  <div ref="{{ ovLast }}" style="position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity 1s ease; pointer-events: none; z-index: 3;">
    <div style="text-align: center;">
      <div style="font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: clamp(18px, 2vw, 36px); letter-spacing: 0.5em; color: rgba(234,242,255,0.9);">ONE LAST BEAT</div>
      <div style="font-family: 'Unbounded', sans-serif; font-weight: 800; font-size: clamp(120px, 20vw, 380px); line-height: 1; color: #eaf2ff; text-shadow: 0 0 80px rgba(94,231,255,0.6); margin-top: 2vh; min-height: 0.4em;">{{ countdown }}</div>
    </div>
  </div>

  <div ref="{{ ovFinal }}" style="position: absolute; left: 50%; top: 76%; transform: translate(-50%, 20px); text-align: center; opacity: 0; transition: opacity 3s ease, transform 3s ease; pointer-events: none;">
    <div ref="{{ finalLine1 }}" style="font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: clamp(26px, 3.4vw, 62px); letter-spacing: 0.34em; background: linear-gradient(90deg, #5ee7ff, #9b6dff, #ff5e8a); -webkit-background-clip: text; background-clip: text; color: transparent;">SYNC COMPLETE</div>
    <div ref="{{ finalLine2 }}" style="margin-top: 1.8vh; opacity: 0; transition: opacity 2.5s ease;">
      <div style="font-size: clamp(11px, 0.9vw, 16px); letter-spacing: 0.5em; color: rgba(234,242,255,0.5);">CREATED BY</div>
      <div style="margin-top: 0.9vh; font-family: 'Unbounded', sans-serif; font-weight: 400; font-size: clamp(16px, 1.6vw, 30px); letter-spacing: 0.24em; color: rgba(234,242,255,0.9);">RACHIT CHAURASIA</div>
    </div>
  </div>

  <div ref="{{ hintBar }}" style="position: absolute; left: 24px; bottom: 18px; font-size: 11px; letter-spacing: 0.18em; color: rgba(234,242,255,0.26); pointer-events: none;">{{ hintText }}</div>
  <div style="position: absolute; right: 24px; bottom: 18px; font-size: 11px; letter-spacing: 0.3em; color: rgba(94,231,255,0.3); pointer-events: none;">{{ sceneTagText }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;particleDensity&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.3, &quot;max&quot;: 2, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Atmosphere&quot;}, &quot;showHints&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Stage&quot;}}">
class Component extends DCLogic {
  state = { scene: 1, countdown: '', demo: false };
  refs = {};
  R(n) { return this.refs[n] || (this.refs[n] = React.createRef()); }
  KEYMAP = { 'KICK': 'kick', 'SNARE': 'snare', 'HI-HATS': 'hats', 'BASS': 'bass', 'CHORDS': 'chords', 'MAIN MELODY': 'mainMel', 'SUPPORT MELODY': 'supMel', 'EFFECTS': 'effects', 'VOICE FX': 'voice', 'FINAL ENERGY': 'finalEnergy' };
  TAGS = ['', 'I · DARKNESS', 'II · CONNECTION', 'III · PROOF', 'IV · RHYTHM', 'V · BASS', 'VI · MELODY', 'VII · VOICE', 'VIII · SILENCE', 'IX · FINAL DROP'];
  DEMO_DUR = { 1: 12, 2: 14, 3: 20, 4: 20, 5: 20, 6: 20, 7: 24, 8: 10, 9: 0 };
  DEMO_NAMES = ['Aarav', 'Ishita', 'Kabir', 'Mira', 'Rohan', 'Sana', 'Dev', 'Anaya', 'Veer', 'Riya'];

  gate(role, scene) {
    if (scene === 9) return true;
    if (scene < 3 || scene === 8) return false;
    switch (role) {
      case 'KICK': return scene >= 3;
      case 'SNARE': case 'HI-HATS': return scene >= 4;
      case 'BASS': case 'CHORDS': return scene >= 5;
      case 'MAIN MELODY': case 'SUPPORT MELODY': case 'EFFECTS': return scene >= 6;
      case 'VOICE FX': return scene >= 7;
      case 'FINAL ENERGY': return false;
    }
    return false;
  }

  componentDidMount() {
    this.timers = [];
    this.vis = {
      pulse: 0, crest: 0, level: 0, beat: 0, prevPhase: 0, energyGlow: 0.04,
      particles: [], sparks: [], beams: [], rings: [], orbiters: [], fog: [],
      nodes: [], t: 0, freezeUntil: 0,
    };
    const cvs = this.R('cvs').current;
    this.ctx2d = cvs.getContext('2d');
    this.onResize = () => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      this.W = cvs.clientWidth; this.H = cvs.clientHeight; this.dpr = dpr;
      cvs.width = this.W * dpr; cvs.height = this.H * dpr;
      this.ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
      this.layoutNodes(); this.seedAmbient();
    };
    window.addEventListener('resize', this.onResize);
    this.onKey = (e) => this.handleKey(e);
    window.addEventListener('keydown', this.onKey);
    Promise.all([import('./sync-state.js'), import('./sync-audio.js')]).then(([S, A]) => {
      this.store = new S.SyncStore('projector');
      this.audio = new A.SyncAudio();
      this.vis.nodes = this.store.get().vols.map(v => ({ id: v.id, x: 0, y: 0, charge: 0, glow: 0, energy: 0 }));
      this.layoutNodes();
      this.unsub = this.store.subscribe(st => this.onStore(st));
      this.unmsg = this.store.onMessage(m => this.onMsg(m));
      this.setState({ scene: this.store.get().scene, demo: this.store.get().demo });
      this.enterScene(this.store.get().scene, 0);
    });
    this.onResize();
    this._raf = requestAnimationFrame(() => this.frame());
    this._bcast = setInterval(() => this.broadcastEnergy(), 220);
    this._demoTick = setInterval(() => this.demoTick(), 130);
    this._heart = setInterval(() => {
      if (this.audio && this.audio.ready && this.state.scene <= 2 && !this.audio.muted)
        this.audio.heartbeat(this.audio.now() + 0.02, 0.16 + this.state.scene * 0.04);
    }, 1600);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
    [this._bcast, this._demoTick, this._heart].forEach(clearInterval);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('keydown', this.onKey);
    this.clearTimers();
    if (this.unsub) this.unsub(); if (this.unmsg) this.unmsg();
    if (this.audio) this.audio.stopTrack(0.2);
  }
  clearTimers() { this.timers.forEach(clearTimeout); this.timers = []; }
  after(ms, fn) { const t = setTimeout(fn, ms); this.timers.push(t); return t; }

  layoutNodes() {
    if (!this.vis.nodes.length) return;
    const L = this.logoPos(), R = Math.min(this.W * 0.36, this.H * 0.38);
    this.vis.nodes.forEach((n, i) => {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 10;
      n.ang = a;
      n.x = L.x + Math.cos(a) * R;
      n.y = L.y + Math.sin(a) * R * 0.92;
    });
  }
  seedAmbient() {
    const count = Math.round(150 * (this.props.particleDensity ?? 1));
    const P = [];
    for (let i = 0; i < count; i++) P.push({
      x: Math.random() * this.W, y: Math.random() * this.H,
      vx: (Math.random() - 0.5) * 0.12, vy: -0.05 - Math.random() * 0.18,
      s: 0.5 + Math.random() * 1.6, tw: Math.random() * 6.28, hue: Math.random(),
    });
    this.vis.particles = P;
    if (!this.vis.fog.length) for (let i = 0; i < 6; i++) this.vis.fog.push({
      x: Math.random() * this.W, y: Math.random() * this.H,
      r: 220 + Math.random() * 320, dx: (Math.random() - 0.5) * 0.16, dy: (Math.random() - 0.5) * 0.1, hue: i % 3,
    });
  }
  logoPos() { return { x: this.W * 0.5, y: this.H * 0.46 }; }

  // ---------- store / messages ----------
  onStore(st) {
    if (st.scene !== this.state.scene) { const p = this.state.scene; this.setState({ scene: st.scene }); this.enterScene(st.scene, p); }
    if (st.demo !== this.state.demo) this.setState({ demo: st.demo });
    if (this.audio && this.audio.ready) this.audio.setMuted(st.muted);
    if (st.resetCount !== this._lastReset) { this._lastReset = st.resetCount; this.localReset(); }
  }
  onMsg(m) {
    if (m.type === 'tap') this.volTap(m.id, true);
    else if (m.type === 'voicePCM') {
      if (!this.audio.ready) this.audio.init();
      const buf = this.audio.setVoiceFromPCM(m.pcm, m.rate);
      this.integrateVoice(buf);
    } else if (m.type === 'voiceSim') this.fallbackVoice();
    else if (m.type === 'proof') this.runProof();
  }
  broadcastEnergy() {
    if (!this.store || !this.vis.nodes.length) return;
    this.store.send('energy', { list: this.vis.nodes.map(n => ({ id: n.id, energy: +n.energy.toFixed(3), charge: +n.charge.toFixed(3) })), scene: this.state.scene, countdown: this.state.countdown });
  }

  // ---------- scenes ----------
  go(n) {
    n = Math.max(1, Math.min(9, n));
    if (n === this.state.scene) return;
    if (this.store) this.store.patch({ scene: n });
    else { const p = this.state.scene; this.setState({ scene: n }); this.enterScene(n, p); }
  }
  enterScene(n, prev) {
    this.clearTimers();
    this.setState({ countdown: '' });
    this.finalShown = false;
    if (this.audio) {
      if (!this.audio.ready && n >= 1) { try { this.audio.init(); } catch (e) {} }
      if (n >= 3 && n < 8) this.audio.playTrack();
      if (n < 3 && this.audio.playing) this.audio.stopTrack();
    }
    if (n < 9) this.vis.crest = 0;
    if (n < 7) this.vis.orbiters = [];
    if (n === 1) this.runOpening();
    if (n === 2 && prev < 2) this.runConnect();
    if (n === 3) this.runProof();
    if (n === 8) { this.after(2000, () => this.runCountdown()); }
    if (n === 9 && prev !== 9) this.runDrop();
    this.applyOverlays();
    if (this.state.demo || (this.store && this.store.get().demo)) this.scheduleDemoAdvance(n);
  }
  show(name, vis) { const el = this.R(name).current; if (el) el.style.opacity = vis ? 1 : 0; }
  applyOverlays() {
    const s = this.state.scene;
    ['ovSync', 'ovQ', 'ovProof', 'ovVoice', 'ovLast', 'ovFinal'].forEach(n => this.show(n, false));
    this.show('ovLast', s === 8);
  }
  runOpening() {
    this.show('ovSync', false);
    this.after(600, () => this.show('ovSync', true));
    this.after(4800, () => this.show('ovSync', false));
    this.after(6800, () => { if (this.state.scene === 1) this.show('ovQ', true); });
    this.after(11500, () => this.show('ovQ', false));
  }
  runConnect() {
    const demo = this.store && this.store.get().demo;
    const L = this.logoPos();
    this.store.get().vols.forEach((v, i) => {
      if (demo && !v.connected) this.after(600 + i * 800, () => {
        this.store.patchVol(v.id, { connected: true, name: this.DEMO_NAMES[i] });
        this.connectFx(v.id);
      });
    });
  }
  connectFx(id) {
    const n = this.vis.nodes[id], L = this.logoPos();
    if (!n) return;
    n.glow = 1;
    this.spark(n.x, n.y, L.x, L.y, this.coreColor(id), 1.2);
    this.vis.energyGlow = Math.min(0.16, this.vis.energyGlow + 0.012);
    if (this.audio && this.audio.ready) this.audio.pluck(this.audio.now() + 0.02, 440 * Math.pow(1.122, id), 0.14);
  }
  runProof() {
    const seq = [
      [200, 'ONE VOLUNTEER.'],
      [2800, 'TAP ONCE.'],
      [7000, 'THAT IS THE KICK.'],
      [11000, 'NOW STOP.'],
      [15000, 'THE PHONES ARE THE INSTRUMENT.'],
    ];
    const pt = this.R('proofText').current;
    seq.forEach(([ms, txt]) => this.after(ms, () => {
      if (this.state.scene !== 3) return;
      if (pt) pt.textContent = txt;
      this.show('ovProof', true);
    }));
    this.after(19500, () => this.show('ovProof', false));
    this._proofWindow = [performance.now() + 2800, performance.now() + 11000];
  }
  runCountdown() {
    ['3', '2', '1'].forEach((c, i) => this.after(i * 1000, () => {
      this.setState({ countdown: c });
      if (this.audio && this.audio.ready) this.audio.tick(this.audio.now() + 0.02);
      const L = this.logoPos();
      this.ring(L.x, L.y, 40, 6, 'rgba(234,242,255,0.5)');
    }));
    this.after(3000, () => {
      this.setState({ countdown: 'NOW' });
      if (this.audio && this.audio.ready) this.audio.tick(this.audio.now() + 0.02, true);
      if (this.store && this.store.get().demo) this.after(900, () => this.go(9));
    });
  }
  runDrop() {
    const L = this.logoPos();
    this.setState({ countdown: '' });
    if (this.audio) {
      if (!this.audio.ready) this.audio.init();
      this.audio.playTrack();
      this.audio.riser(this.audio.now(), 1.1, 0.6);
    }
    this.vis.nodes.forEach((n, i) => this.after(120 + i * 55, () => {
      n.charge = 1; n.energy = 1;
      this.fireBeam(n, true);
    }));
    // freeze — half second of silence, everything holds
    this.after(1150, () => {
      this.vis.freezeUntil = performance.now() + 520;
      if (this.audio && this.audio.ready) this.audio.master.gain.setTargetAtTime(0.0001, this.audio.now(), 0.03);
    });
    this.after(1680, () => {
      if (this.audio && this.audio.ready) {
        this.audio.master.gain.setTargetAtTime(this.audio.muted ? 0 : 0.95, this.audio.now(), 0.05);
        this.audio.impact(this.audio.now() + 0.02, 1);
      }
      this.vis.pulse = 1.6;
      this.vis.nodes.forEach(n => n.energy = 1);
      this.ring(L.x, L.y, 30, 22, 'rgba(94,231,255,0.8)', 7);
      this.ring(L.x, L.y, 30, 15, 'rgba(155,109,255,0.6)', 4);
      this.ring(L.x, L.y, 30, 9, 'rgba(255,94,138,0.5)', 3);
      // elegant particle bloom — radial push, no confetti
      this.vis.particles.forEach(p => {
        const dx = p.x - L.x, dy = p.y - L.y, d = Math.hypot(dx, dy) || 1;
        p.vx += (dx / d) * 3.2; p.vy += (dy / d) * 3.2;
      });
      const t0 = performance.now();
      const fade = () => { const p = Math.min(1, (performance.now() - t0) / 2600); this.vis.crest = p; if (p < 1) requestAnimationFrame(fade); };
      fade();
      this.vis.orbiters.forEach(o => o.speed *= 1.8);
    });
    this.after(15000, () => { this._settle = true; });
    this.after(20000, () => {
      this.finalShown = true;
      const el = this.R('ovFinal').current;
      if (el) { el.style.opacity = 1; el.style.transform = 'translate(-50%, 0)'; }
      this.after(3500, () => { const l2 = this.R('finalLine2').current; if (l2) l2.style.opacity = 1; });
    });
  }
  localReset() {
    this.clearTimers();
    this._settle = false; this.finalShown = false;
    if (this.audio) this.audio.stopTrack(0.4);
    Object.assign(this.vis, { pulse: 0, crest: 0, sparks: [], beams: [], rings: [], orbiters: [], energyGlow: 0.04, freezeUntil: 0 });
    this.vis.nodes.forEach(n => { n.charge = 0; n.glow = 0; n.energy = 0; });
    this.setState({ scene: 1, countdown: '', demo: false });
    this.enterScene(1, 0);
  }

  // ---------- interaction ----------
  handleKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === ' ') { e.preventDefault(); this.go(this.state.scene + 1); }
    else if (k === 'ArrowLeft') this.go(this.state.scene - 1);
    else if (k >= '1' && k <= '9') this.go(+k);
    else if (k === 'd' || k === 'D') this.toggleDemo();
    else if (k === 'm' || k === 'M') { if (this.store) this.store.patch({ muted: !this.store.get().muted }); }
    else if (k === 'r' || k === 'R') { if (this.store) this.store.reset(); }
    else if (k === 'v' || k === 'V') this.recordVoice();
    else if (k === 'f' || k === 'F') this.fallbackVoice();
    else if (k === 'c' || k === 'C') window.open('SYNC — Conductor.dc.html', '_blank');
  }
  toggleDemo() {
    if (!this.store) return;
    const demo = !this.store.get().demo;
    this.store.patch({ demo });
    if (demo) {
      if (this.audio && !this.audio.ready) this.audio.init();
      if (this.state.scene === 1) { this.enterScene(1, 0); this.scheduleDemoAdvance(1); }
      else this.scheduleDemoAdvance(this.state.scene);
    } else if (this._adv) clearTimeout(this._adv);
  }
  scheduleDemoAdvance(n) {
    if (this._adv) clearTimeout(this._adv);
    if (n === 7) this.after(3000, () => { if (this.store.get().demo && !this.audio.voiceBuffer) this.fallbackVoice(); });
    const d = this.DEMO_DUR[n];
    if (d) this._adv = this.after(d * 1000, () => { if (this.store.get().demo) this.go(n + 1); });
  }
  demoTick() {
    if (!this.store || !this.store.get().demo) return;
    const s = this.state.scene;
    if (s < 3 || s === 8 || s === 9) return;
    const now = performance.now();
    this.store.get().vols.forEach(v => {
      if (!this.gate(v.role, s)) return;
      if (s === 3) {
        if (v.role !== 'KICK') return;
        if (!this._proofWindow || now < this._proofWindow[0] || now > this._proofWindow[1]) return;
      }
      const n = this.vis.nodes[v.id];
      const target = 0.72;
      if (n.energy < target && Math.random() < 0.4) this.volTap(v.id);
    });
  }
  onCanvasClick = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    let best = null, bd = 70;
    this.vis.nodes.forEach(n => { const d = Math.hypot(n.x - x, n.y - y); if (d < bd) { bd = d; best = n; } });
    if (best) this.volTap(best.id);
  };
  coreColor(id) { return this.store ? this.store.get().vols[id].color : '#5ee7ff'; }
  volTap(id, remote) {
    if (!this.store) return;
    const sv = this.store.get().vols[id], n = this.vis.nodes[id];
    if (!sv || !sv.enabled || sv.muted || !n) return;
    const live = this.gate(sv.role, this.state.scene);
    n.glow = 1;
    let delay = 0.05;
    if (this.audio && this.audio.ready && live) delay = this.audio.tapSound(sv.role) || 0.05;
    const L = this.logoPos();
    this.after(delay * 1000, () => {
      this.spark(n.x, n.y, L.x, L.y, sv.color, live ? 0.6 : 0.3);
      this.ring(n.x, n.y, 8, 3, sv.color + 'aa', 2);
    });
    if (live) {
      n.energy = Math.min(1, n.energy + 0.13);
      n.charge = Math.min(1, n.charge + 0.09);
      if (n.charge >= 1 && this.state.scene >= 4 && this.state.scene < 8) this.fireBeam(n);
    }
  }
  fireBeam(n, silent) {
    n.charge = 0;
    const L = this.logoPos();
    const color = this.coreColor(n.id);
    if (!silent && this.audio && this.audio.ready) this.audio.riser(this.audio.now(), 0.5, 0.3);
    this.vis.beams.push({ x: n.x, y: n.y, tx: L.x, ty: L.y, t0: performance.now(), dur: 1100, color });
    this.after(700, () => {
      this.vis.pulse = Math.min(1.4, this.vis.pulse + (silent ? 0.5 : 0.7));
      this.ring(L.x, L.y, 36, 8, color + 'cc', 3.4);
      if (!silent && this.audio && this.audio.ready) this.audio.impact(this.audio.now() + 0.02, 0.3);
    });
  }
  spark(x, y, tx, ty, color, size = 1) {
    const cx = (x + tx) / 2 + (Math.random() - 0.5) * 200;
    const cy = (y + ty) / 2 + (Math.random() - 0.5) * 120;
    this.vis.sparks.push({ x, y, tx, ty, cx, cy, dur: 500 + Math.random() * 240, t0: performance.now(), color, size });
  }
  ring(x, y, r, vr, color, w = 2) { this.vis.rings.push({ x, y, r, vr, a: 0.9, color, w }); }

  // ---------- voice ----------
  async recordVoice() {
    if (this._recording || !this.audio) return;
    if (!this.audio.ready) this.audio.init();
    if (this.state.scene !== 7) this.go(7);
    this._recording = true;
    const label = this.R('voiceLabel').current;
    if (label) label.textContent = 'SAY ONE WORD';
    this.show('ovVoice', true);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ac = this.audio.ctx;
      const src = ac.createMediaStreamSource(stream);
      const an = ac.createAnalyser(); an.fftSize = 2048;
      src.connect(an);
      this._liveAnalyser = an;
      const rec = new MediaRecorder(stream);
      const chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      rec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        this._liveAnalyser = null;
        try {
          const buf = await new Blob(chunks).arrayBuffer();
          const audioBuf = await ac.decodeAudioData(buf);
          this.audio.voiceBuffer = audioBuf;
          this.integrateVoice(audioBuf);
        } catch (err) { this.fallbackVoice(); }
        this._recording = false;
      };
      rec.start();
      setTimeout(() => rec.state !== 'inactive' && rec.stop(), 2000);
    } catch (err) { this._recording = false; this.fallbackVoice(); }
  }
  fallbackVoice = () => {
    if (!this.audio) return;
    if (!this.audio.ready) this.audio.init();
    if (this.state.scene !== 7) this.go(7);
    this.integrateVoice(this.audio.makeFallbackVoice());
  };
  integrateVoice(buf) {
    const label = this.R('voiceLabel').current;
    if (label) label.textContent = 'YOUR VOICE';
    this.show('ovVoice', true);
    if (this.store) this.store.patch({ voiceStatus: 'live' });
    const wc = this.R('waveCvs').current;
    const d = buf.getChannelData(0);
    this.drawWave(wc.getContext('2d'), wc, d);
    if (this.audio.ready) this.audio.playVoice(this.audio.now() + 0.1, 0.9);
    const vn = this.vis.nodes[8];
    if (vn) vn.energy = Math.max(vn.energy, 0.8);
    this.after(2400, () => {
      const rect = wc.getBoundingClientRect();
      const N = 80;
      for (let i = 0; i < N; i++) {
        const f = i / (N - 1);
        const idx = Math.floor(f * (d.length - 1));
        let amp = 0;
        for (let j = 0; j < 400 && idx + j < d.length; j += 40) amp = Math.max(amp, Math.abs(d[idx + j]));
        this.vis.orbiters.push({
          x: rect.left + f * rect.width, y: rect.top + rect.height / 2 + (i % 2 ? 1 : -1) * amp * rect.height * 0.45,
          mode: 'fly', ang: Math.random() * 6.28, rad: this.H * (0.16 + Math.random() * 0.1),
          speed: (0.4 + Math.random() * 0.5) * (Math.random() < 0.5 ? 1 : -1),
          s: 1 + amp * 4, flyP: 0, color: i % 5 === 0 ? '#ff5e8a' : (i % 2 ? '#5ee7ff' : '#eaf2ff'),
        });
      }
      this.show('ovVoice', false);
    });
  }
  drawWave(g, wc, data, liveArr) {
    g.clearRect(0, 0, wc.width, wc.height);
    const mid = wc.height / 2, W = wc.width;
    g.lineWidth = 3; g.lineCap = 'round';
    g.shadowBlur = 24; g.shadowColor = 'rgba(94,231,255,0.9)';
    g.strokeStyle = '#5ee7ff';
    g.beginPath();
    const N = 240;
    for (let i = 0; i < N; i++) {
      const f = i / (N - 1);
      let amp = 0;
      if (liveArr) amp = (liveArr[Math.floor(f * (liveArr.length - 1))] - 128) / 128;
      else {
        const idx = Math.floor(f * (data.length - 1));
        for (let j = 0; j < 300 && idx + j < data.length; j += 30) amp = Math.max(amp, Math.abs(data[idx + j]));
        amp *= Math.sin(f * Math.PI) > 0.05 ? 1 : 0.4;
      }
      const y = mid + (liveArr ? amp : (i % 2 ? amp : -amp)) * mid * 0.85;
      i === 0 ? g.moveTo(f * W, y) : g.lineTo(f * W, y);
    }
    g.stroke();
  }

  // ---------- render ----------
  frame() {
    this._raf = requestAnimationFrame(() => this.frame());
    const g = this.ctx2d, W = this.W, H = this.H, vis = this.vis;
    if (!g || !W) return;
    const now = performance.now();
    const frozen = now < vis.freezeUntil;
    const dt = frozen ? 0 : Math.min(50, now - (this._last || now)) / 16.7;
    this._last = now;
    vis.t += dt * 0.016;
    const A = this.audio, st = this.store ? this.store.get() : null;
    const level = A && A.ready ? A.getLevel() : 0;
    vis.level += (level - vis.level) * 0.2;
    vis.beat *= Math.pow(0.92, dt);
    vis.pulse *= Math.pow(0.955, dt);
    const s = this.state.scene;
    // beat detect from grid phase
    if (A && A.playing) {
      const ph = A.beatPhase();
      if (ph < vis.prevPhase) vis.beat = 1;
      vis.prevPhase = ph;
    }
    // energy decay + engine feed
    let sum = 0, count = 0;
    if (st) {
      const e = {};
      vis.nodes.forEach(n => {
        const v = st.vols[n.id];
        const live = this.gate(v.role, s) && v.enabled && !v.muted;
        if (!this._settle) n.energy *= Math.pow(0.9988, dt * (st.demo ? 0.9 : 1));
        else n.energy *= Math.pow(0.9975, dt);
        if (s === 9 && !this._settle) n.energy = Math.max(n.energy, 0.9);
        const eff = live || s === 9 ? n.energy : 0;
        e[this.KEYMAP[v.role]] = eff;
        if (this.gate(v.role, s) || s === 9) { sum += eff; count++; }
      });
      if (s === 9) e.finalEnergy = this._settle ? 0.3 : 1;
      if (A && A.ready && A.playing) A.setEnergies(e);
    }
    const avg = count ? sum / count : 0;
    const targetGlow = s === 1 ? 0.04 : s === 2 ? 0.05 + 0.11 * (st ? st.vols.filter(v => v.connected).length / 10 : 0)
      : s === 9 ? 1 : Math.min(0.9, 0.1 + s * 0.055 + avg * 0.45);
    vis.energyGlow += (targetGlow - vis.energyGlow) * 0.02 * dt;
    const E = vis.energyGlow, lv = vis.level, L = this.logoPos();
    g.clearRect(0, 0, W, H);
    // fog
    const hues = ['94,231,255', '155,109,255', '77,124,254'];
    const fogA = 0.03 + E * 0.06;
    vis.fog.forEach(f => {
      f.x += f.dx * dt; f.y += f.dy * dt;
      if (f.x < -f.r) f.x = W + f.r; if (f.x > W + f.r) f.x = -f.r;
      if (f.y < -f.r) f.y = H + f.r; if (f.y > H + f.r) f.y = -f.r;
      const gr = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
      gr.addColorStop(0, `rgba(${hues[f.hue]},${fogA})`);
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = gr;
      g.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    });
    g.globalCompositeOperation = 'lighter';
    // particles
    const pb = 0.22 + E * 0.75 + lv * 0.4;
    vis.particles.forEach(p => {
      p.vx *= Math.pow(0.985, dt); p.vy = p.vy * Math.pow(0.985, dt) - 0.0004 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.tw += 0.03 * dt;
      if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; p.vy = -0.05 - Math.random() * 0.18; }
      if (p.x < -4) p.x = W + 4; if (p.x > W + 4) p.x = -4;
      const a = (0.12 + 0.3 * Math.abs(Math.sin(p.tw))) * pb;
      g.fillStyle = p.hue < 0.6 ? `rgba(160,220,255,${a})` : p.hue < 0.85 ? `rgba(190,160,255,${a})` : `rgba(255,160,190,${a * 0.8})`;
      g.beginPath(); g.arc(p.x, p.y, p.s * (1 + vis.beat * 0.3), 0, 7); g.fill();
    });
    // cores
    if (st) vis.nodes.forEach(n => {
      const v = st.vols[n.id];
      const live = this.gate(v.role, s) || s === 9;
      n.glow *= Math.pow(0.93, dt);
      const base = !v.connected ? 0.07 : !v.enabled ? 0.1 : v.muted ? 0.16 : live ? 0.45 + n.energy * 0.5 : 0.3;
      g.shadowBlur = 16 + n.energy * 14; g.shadowColor = v.color;
      g.fillStyle = v.color;
      g.globalAlpha = Math.min(1, base + n.glow * 0.5);
      const rad = 5 + n.energy * 5 + n.glow * 3 + (live ? vis.beat * 2.2 : 0);
      g.beginPath(); g.arc(n.x, n.y, rad, 0, 7); g.fill();
      g.shadowBlur = 0;
      if (v.connected && v.enabled && n.charge > 0.01 && s >= 4 && s < 8) {
        g.globalAlpha = 0.7;
        g.strokeStyle = v.color; g.lineWidth = 2.2; g.lineCap = 'round';
        g.beginPath(); g.arc(n.x, n.y, rad + 8, -Math.PI / 2, -Math.PI / 2 + n.charge * 6.283); g.stroke();
      }
      // orbital dust ∝ energy (instead of bars)
      if (n.energy > 0.05 && v.connected) {
        const dots = Math.floor(n.energy * 6);
        for (let i = 0; i < dots; i++) {
          const a2 = vis.t * (1 + i * 0.3) * 2 + i * 2.1 + n.id;
          g.globalAlpha = 0.5 * n.energy;
          g.beginPath(); g.arc(n.x + Math.cos(a2) * (rad + 13 + i * 3), n.y + Math.sin(a2) * (rad + 13 + i * 3), 1.3, 0, 7); g.fill();
        }
      }
      const outside = Math.sin(n.ang) > 0.3 ? 30 : -24;
      g.globalAlpha = v.connected ? 0.45 : 0.15;
      g.font = '500 10px Space Grotesk'; g.textAlign = 'center';
      g.fillStyle = '#eaf2ff';
      g.fillText(v.name || v.role, n.x, n.y + (outside > 0 ? rad + 22 : -rad - 14));
      if (v.name) { g.globalAlpha = 0.28; g.font = '500 8px Space Grotesk'; g.fillText(v.role, n.x, n.y + (outside > 0 ? rad + 34 : -rad - 26)); }
      g.globalAlpha = 1;
    });
    // sparks
    vis.sparks = vis.sparks.filter(sp => {
      const p = (now - sp.t0) / sp.dur;
      if (p >= 1) { vis.pulse = Math.min(1.3, vis.pulse + 0.08 * sp.size); return false; }
      const q = 1 - p;
      const x = q * q * sp.x + 2 * q * p * sp.cx + p * p * sp.tx;
      const y = q * q * sp.y + 2 * q * p * sp.cy + p * p * sp.ty;
      g.shadowBlur = 14; g.shadowColor = sp.color;
      g.fillStyle = sp.color; g.globalAlpha = 0.9;
      g.beginPath(); g.arc(x, y, 2.4 * sp.size * (1 - p * 0.4), 0, 7); g.fill();
      g.shadowBlur = 0; g.globalAlpha = 1;
      return true;
    });
    // beams
    vis.beams = vis.beams.filter(b => {
      const p = (now - b.t0) / b.dur;
      if (p >= 1) return false;
      const env = p < 0.15 ? p / 0.15 : p > 0.7 ? (1 - p) / 0.3 : 1;
      const gr = g.createLinearGradient(b.x, b.y, b.tx, b.ty);
      gr.addColorStop(0, b.color + '00');
      gr.addColorStop(0.35, b.color + 'cc');
      gr.addColorStop(1, '#ffffffdd');
      g.strokeStyle = gr; g.globalAlpha = env;
      g.lineCap = 'round';
      g.shadowBlur = 26; g.shadowColor = b.color;
      g.lineWidth = 2 + env * 4;
      g.beginPath(); g.moveTo(b.x, b.y); g.lineTo(b.tx, b.ty); g.stroke();
      for (let i = 0; i < 3; i++) {
        const pp = (p * 2.2 + i * 0.33) % 1;
        g.fillStyle = '#ffffff'; g.globalAlpha = env * 0.9;
        g.beginPath(); g.arc(b.x + (b.tx - b.x) * pp, b.y + (b.ty - b.y) * pp, 3.2, 0, 7); g.fill();
      }
      g.shadowBlur = 0; g.globalAlpha = 1;
      return true;
    });
    // rings
    vis.rings = vis.rings.filter(r => {
      r.r += r.vr * dt; r.a *= Math.pow(0.955, dt);
      if (r.a < 0.02) return false;
      g.strokeStyle = r.color; g.globalAlpha = r.a; g.lineWidth = r.w;
      g.beginPath(); g.arc(r.x, r.y, r.r, 0, 7); g.stroke();
      g.globalAlpha = 1;
      return true;
    });
    // orbiters
    vis.orbiters.forEach(o => {
      if (o.mode === 'fly') {
        o.flyP = Math.min(1, o.flyP + 0.006 * dt);
        const tx = L.x + Math.cos(o.ang) * o.rad, ty = L.y + Math.sin(o.ang) * o.rad * 0.62;
        o.x += (tx - o.x) * 0.03 * dt; o.y += (ty - o.y) * 0.03 * dt;
        if (o.flyP >= 1) o.mode = 'orbit';
        g.globalAlpha = 0.6;
      } else {
        o.ang += o.speed * 0.012 * dt * (1 + vis.beat * 0.8);
        const rad = o.rad * (1 + vis.beat * 0.05 + lv * 0.06);
        o.x = L.x + Math.cos(o.ang) * rad;
        o.y = L.y + Math.sin(o.ang) * rad * 0.62;
        g.globalAlpha = 0.55 + vis.beat * 0.4;
      }
      g.shadowBlur = 10; g.shadowColor = o.color;
      g.fillStyle = o.color;
      g.beginPath(); g.arc(o.x, o.y, o.s * (1 + vis.beat * 0.4), 0, 7); g.fill();
      g.shadowBlur = 0; g.globalAlpha = 1;
    });
    g.globalCompositeOperation = 'source-over';
    if (this._liveAnalyser) {
      const arr = new Uint8Array(this._liveAnalyser.fftSize);
      this._liveAnalyser.getByteTimeDomainData(arr);
      const wc = this.R('waveCvs').current;
      if (wc) this.drawWave(wc.getContext('2d'), wc, null, arr);
    }
    // logo
    const kickE = st ? (this.gate('KICK', s) || s === 9 ? vis.nodes[0].energy : 0) : 0;
    const bassE = st ? (this.gate('BASS', s) || s === 9 ? vis.nodes[3].energy : 0) : 0;
    const kickP = Math.pow(Math.max(0, 1 - (A && A.playing ? A.beatPhase() : 0.5)), 3);
    const breathe = Math.sin(vis.t * 1.4) * 0.01 * (0.4 + E);
    const scale = 1 + breathe + kickP * (0.01 + 0.03 * Math.max(kickE, bassE)) + vis.pulse * 0.05;
    const ls = this.R('logoScale').current;
    if (ls) ls.style.transform = `scale(${scale.toFixed(4)})`;
    const ig = this.R('imgGlow').current, ic = this.R('imgCrest').current, hl = this.R('halo').current;
    if (ig) ig.style.opacity = Math.min(1, 0.04 + E * 0.9 + vis.pulse * 0.25) * (1 - vis.crest * 0.85);
    if (ic) ic.style.opacity = vis.crest * Math.min(1, 0.75 + kickP * 0.25 + vis.pulse * 0.3);
    if (hl) hl.style.opacity = Math.min(1, E * 0.7 + kickP * bassE * 0.5 + vis.pulse * 0.6);
  }

  renderVals() {
    return {
      cvs: this.R('cvs'), logoWrap: this.R('logoWrap'), logoScale: this.R('logoScale'),
      imgGlow: this.R('imgGlow'), imgCrest: this.R('imgCrest'), halo: this.R('halo'),
      ovSync: this.R('ovSync'), ovQ: this.R('ovQ'), ovProof: this.R('ovProof'), proofText: this.R('proofText'),
      ovVoice: this.R('ovVoice'), voiceLabel: this.R('voiceLabel'), waveCvs: this.R('waveCvs'),
      ovLast: this.R('ovLast'), ovFinal: this.R('ovFinal'), finalLine1: this.R('finalLine1'), finalLine2: this.R('finalLine2'),
      hintBar: this.R('hintBar'),
      countdown: this.state.countdown,
      onCanvasClick: this.onCanvasClick,
      hintText: (this.props.showHints ?? true) ? '→ SCENES · D DEMO · C CONDUCTOR · M MUTE · CLICK A CORE TO TAP' : '',
      sceneTagText: this.finalShown ? '' : this.TAGS[this.state.scene] + (this.state.demo ? ' · DEMO' : ''),
    };
  }
}
</script>
</body>
</html>
